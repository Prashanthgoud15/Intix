services:
  - type: web
    name: intix-server
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        # 1h, not 15m: a short expiry meant the frontend had to silently
        # refresh far more often mid-session, which surfaced as a burst of
        # 401s during real interview sessions. Keep this in sync with
        # server/env.example — if one changes, update the other too.
        value: 1h
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        # Set this to your deployed Vercel URL(s) after the frontend is live,
        # e.g. https://your-app.vercel.app — comma-separated if you have more
        # than one (custom domain + preview URL, etc).
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 5
      - key: MAX_AUDIO_SIZE_MB
        value: 25
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: AUTH_RATE_LIMIT_MAX
        value: 10
      - key: AI_RATE_LIMIT_MAX
        value: 20
